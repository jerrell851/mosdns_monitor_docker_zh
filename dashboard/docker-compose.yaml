volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.167.0/24
          gateway: 192.168.167.1

services:
  vector:
    container_name: vector
    image: timberio/vector:latest-alpine
    ports:
      - "9010:9010/udp"
    volumes:
      - ./vector/config.yml:/etc/vector/vector.yaml
    restart: always
    networks:
      - monitoring

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.tmpl
      - prometheus_data:/prometheus
    environment:
      # ↓ 改为你的 mosdns 地址 (IP:8338)
      - PROMETHEUS_TARGET=192.168.11.1:8338
    entrypoint:
      - sh
      - -euc
      - |
        sed "s|__PROMETHEUS_TARGET__|$${PROMETHEUS_TARGET}|g" \
          /etc/prometheus/prometheus.tmpl > /etc/prometheus/prometheus.yml
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
    networks:
      - monitoring

  loki:
    container_name: loki
    image: grafana/loki:3.4.3
    user: root
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  grafana:
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./panel:/etc/grafana/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_LANGUAGE=zh-Hans
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - monitoring
