volumes:
  prometheus_data:
  grafana_data:
  vector_data:

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.167.0/24
          gateway: 192.168.167.1
          
services:
  vector:
    container_name: vector
    image: timberio/vector:latest-alpine
    environment:
      - VECTOR_LOG_PORT=${VECTOR_LOG_PORT}
    ports:
      - "${VECTOR_LOG_PORT}:${VECTOR_LOG_PORT}"
    volumes:
      - ./vector/config.yml:/etc/vector/vector.yaml
      - vector_data:/tmp/vector
    restart: always
    networks:
      - monitoring

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.tmpl
      - prometheus_data:/prometheus
    environment:
      - PROMETHEUS_TARGET=${PROMETHEUS_TARGET}
    entrypoint:
      - sh
      - -euc
      - |
        sed "s|__PROMETHEUS_TARGET__|${PROMETHEUS_TARGET}|g" \
          /etc/prometheus/prometheus.tmpl > /etc/prometheus/prometheus.yml
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    restart: always
    networks:
      - monitoring

  loki:
    container_name: loki
    image: grafana/loki:3.4.3
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  promtail:
    container_name: promtail
    image: grafana/promtail:3.4.3
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml
      - vector_data:/tmp/vector
    command: -config.file=/etc/promtail/config.yaml
    restart: always
    networks:
      - monitoring

  grafana:
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          uid: ${LOKI_DATASOURCE_UID}
          access: proxy
          orgId: 1
          url: http://loki:${LOKI_PORT}
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        - name: Prometheus
          type: prometheus
          uid: ${PROMETHEUS_DATASOURCE_UID}
          access: proxy
          orgId: 1
          url: http://prometheus:${PROMETHEUS_PORT}
          basicAuth: false
          isDefault: false
          version: 1
          editable: false
        EOF
        /run.sh
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    networks:
      - monitoring
