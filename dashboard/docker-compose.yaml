volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.167.0/24
          gateway: 192.168.167.1

services:
  vector:
    container_name: vector
    image: timberio/vector:latest-alpine
    ports:
      - "9010:9010/udp"
    volumes:
      - ./vector/config.yml:/etc/vector/vector.yaml
    restart: always
    networks:
      - monitoring

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.tmpl
      - prometheus_data:/prometheus
    environment:
      # ↓ 改为你的 mosdns 地址 (IP:8338)
      - PROMETHEUS_TARGET=192.168.11.1:8338
    entrypoint:
      - sh
      - -euc
      - |
        sed "s|__PROMETHEUS_TARGET__|$${PROMETHEUS_TARGET}|g" \
          /etc/prometheus/prometheus.tmpl > /etc/prometheus/prometheus.yml
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
    networks:
      - monitoring

  loki:
    container_name: loki
    image: grafana/loki:3.4.3
    user: root
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  grafana:
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /etc/grafana/provisioning/datasources
        cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
        apiVersion: 1
        datasources:
        - name: Loki
          type: loki
          uid: P8E80F9AEF21F6940
          access: proxy
          orgId: 1
          url: http://loki:3100
          basicAuth: false
          isDefault: true
          version: 1
          editable: false
        - name: Prometheus
          type: prometheus
          uid: ffkn40vmjsdtsf
          access: proxy
          orgId: 1
          url: http://prometheus:9090
          basicAuth: false
          isDefault: false
          version: 1
          editable: false
        EOF
        /run.sh
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - monitoring
