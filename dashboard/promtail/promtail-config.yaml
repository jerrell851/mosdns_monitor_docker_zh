server:
  disable: true

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

target_config:
  sync_period: "10s"

scrape_configs:
  - job_name: mosdns
    static_configs:
      - targets:
          - localhost
        labels:
          app: mosdns
          type: mosdns
          __path__: /tmp/vector/events.json
